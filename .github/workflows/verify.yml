name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Run renderer tests
        run: python -m unittest discover -s tests -v
      - name: Validate the synthetic archive
        run: python -m evidence_archive_museum.cli validate examples/synthetic_archive
      - name: Rebuild the offline example
        run: python -m evidence_archive_museum.cli build examples/synthetic_archive --output /tmp/museum.html --title "Synthetic Lab Chronicle"
      - name: Compile package
        run: python -m compileall -q evidence_archive_museum
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
